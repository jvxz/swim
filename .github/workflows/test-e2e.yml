name: e2e tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e:
    name: e2e tests
    runs-on: ubicloud-standard-4
    env:
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v6

      - name: install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libasound2-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            webkit2gtk-driver \
            xvfb \
            dbus-x11

      - uses: dtolnay/rust-toolchain@stable

      # Owns Node (.node-version), pnpm (package.json#packageManager), vp and the
      # dependency cache, and runs `vp install` for us.
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: .node-version
          cache: true

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          prefix-key: e2e-ubicloud
          workspaces: src-tauri -> target

      - name: cache tauri-driver binary
        id: tauri-driver-cache
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/tauri-driver
          key: tauri-driver-${{ runner.os }}-${{ runner.arch }}-v1

      - name: install tauri-driver
        if: steps.tauri-driver-cache.outputs.cache-hit != 'true'
        run: cargo install tauri-driver --locked

      - name: run tests
        env:
          # CI runners expose no real GPU to Xvfb, so WebKitGTK's DMA-BUF
          # renderer intermittently fails to acquire a DRI3 device
          # ("libEGL warning: DRI3 error: Could not get DRI3 device"),
          # crashing the webview a few reloads into the startup stress test.
          # Force software GL + WebKit's non-DMA-BUF path so rendering
          # doesn't depend on runner GPU availability.
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run vp run test:e2e
